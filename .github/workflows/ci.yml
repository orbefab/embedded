# What CI runs, and when. This header is where that is written down.
# scripts/check.sh says what each command runs.
# Lint (`check.sh lint`), the Rust tests (`check.sh rust`), the viewer checks
# and the site suite on wrangler run in parallel on every pull request and on
# every push to main. The viewer fixture is two shards of one Playwright run.
# Each shard plays the page with no session, which runs a Block, so those jobs
# install Rust and wasm-bindgen. The page build itself does not. The site
# suite on wrangler is three shards. The site suite on vite preview, which
# includes the install-line build, and the Firefox and WebKit smoke run on
# main and nightly. The engine checks (`check.sh engine-chips`, `engine-circuits` and
# `engine-wasm`) run in parallel on main and nightly, and on a pull request
# when scripts/ci-engine-changed.sh prints run=true. The cargo cache keeps
# dependencies only. Caching the workspace crates still rebuilt them after
# checkout, so those artifacts are left out. scripts/check-speed.sh stays
# a local check.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "4"
  NO_COLOR: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  scope:
    name: engine paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.paths.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Engine paths
        id: paths
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          scripts/ci-engine-changed.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: true
          uv: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Lint
        run: scripts/check.sh lint

      # Release builds also target macOS arm64, where some libc types differ (`st_dev` is an
      # `i32`). Clippy for that target catches a build that breaks only there. It needs no Mac,
      # since it type-checks without linking.
      - name: Lint for macOS
        run: |
          rustup target add aarch64-apple-darwin
          cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings

  rust-tests:
    name: rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: true
          nextest: true
          uv: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Rust tests
        run: scripts/check.sh rust

  viewer:
    name: viewer ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          playwright: chromium
          rust: true
          cargo-cache-key: web
          wasm-bindgen: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Viewer fixture
        run: |
          scripts/check-viewer.sh
          scripts/check-viewer-e2e.sh --shard "${{ matrix.shard }}"

  viewer-blocks:
    name: block, headed, world
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          playwright: chromium
          rust: true
          cargo-cache-key: web
          wasm-bindgen: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Block, headed and world
        run: |
          scripts/check-block.sh
          scripts/check-headed.sh

  site:
    name: site ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          playwright: chromium
          rust: true
          cargo-cache-key: web
          wasm-bindgen: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Site on wrangler
        run: scripts/check-site.sh --servers wrangler --shard "${{ matrix.shard }}"

  engine-chips:
    name: engine-chips
    needs: scope
    if: >-
      always() && !cancelled() &&
      (needs.scope.result == 'success' || needs.scope.result == 'skipped') &&
      (github.event_name != 'pull_request' || needs.scope.outputs.engine == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: true
          nextest: true
          uv: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Chip skip checks
        run: scripts/check.sh engine-chips

  engine-circuits:
    name: engine-circuits
    needs: scope
    if: >-
      always() && !cancelled() &&
      (needs.scope.result == 'success' || needs.scope.result == 'skipped') &&
      (github.event_name != 'pull_request' || needs.scope.outputs.engine == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: true
          nextest: true
          uv: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Circuit checks
        run: scripts/check.sh engine-circuits

  engine-wasm:
    name: engine-wasm
    needs: scope
    if: >-
      always() && !cancelled() &&
      (needs.scope.result == 'success' || needs.scope.result == 'skipped') &&
      (github.event_name != 'pull_request' || needs.scope.outputs.engine == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          rust: true
          rust-targets: wasm32-wasip1
          wasm-bindgen: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: WASI and the wasm package
        run: scripts/check.sh engine-wasm

  site-vite:
    name: site vite
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          playwright: chromium
          rust: true
          cargo-cache-key: web
          wasm-bindgen: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Site on vite preview
        run: scripts/check-site.sh --servers vite

  engines:
    name: engines
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          playwright: firefox-webkit
          rust: true
          cargo-cache-key: web
          wasm-bindgen: true
          cache-save: ${{ env.CACHE_SAVE }}

      - name: Build the viewer page, the Block it plays, and the site
        run: |
          pnpm --filter @orbe/viewer-page build
          scripts/wasm.sh .scratch/wasm/pkg
          cargo build -p orbe --locked
          rm -rf .scratch/wasm/registry
          target/debug/orbe registry build . .scratch/wasm/registry >/dev/null
          scripts/site.sh

      - name: Firefox and WebKit
        run: scripts/check-engines.sh

  ci-ok:
    name: ci-ok
    needs: [scope, lint, rust-tests, viewer, viewer-blocks, site, engine-chips, engine-circuits, engine-wasm]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the other jobs
        env:
          SCOPE: ${{ needs.scope.result }}
          LINT: ${{ needs.lint.result }}
          RUST: ${{ needs.rust-tests.result }}
          VIEWER: ${{ needs.viewer.result }}
          VIEWER_BLOCKS: ${{ needs.viewer-blocks.result }}
          SITE: ${{ needs.site.result }}
          ENGINE_CHIPS: ${{ needs.engine-chips.result }}
          ENGINE_CIRCUITS: ${{ needs.engine-circuits.result }}
          ENGINE_WASM: ${{ needs.engine-wasm.result }}
        run: |
          failed=
          for name in SCOPE LINT RUST VIEWER VIEWER_BLOCKS SITE ENGINE_CHIPS ENGINE_CIRCUITS ENGINE_WASM; do
            result=${!name}
            case $result in
              success|skipped) ;;
              *)
                echo "$name is $result" >&2
                failed=1
                ;;
            esac
          done
          [[ -z $failed ]]

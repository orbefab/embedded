# Each file's licence, as REUSE 3.3 reads it (https://reuse.software/spec-3.3/). Of the
# annotations whose path matches a file, the last one applies, and a file's own SPDX line wins.
version = 1

# The scene, the sketch, the tests, the README and NOTICE.
[[annotations]]
path = "**"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The image links the AVR runtime, and LICENSE-runtime is that runtime's licence.
[[annotations]]
path = ["firmware/*.hex", "firmware/LICENSE-runtime"]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# The notice the toolchain's C library asks to travel with the image.
[[annotations]]
path = "firmware/LICENSE-libc"
SPDX-License-Identifier = "BSD-3-Clause"

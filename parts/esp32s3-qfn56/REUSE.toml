# Each file's licence, as REUSE 3.3 reads it (https://reuse.software/spec-3.3/). Of the
# annotations whose path matches a file, the last one applies, and a file's own SPDX line wins.
version = 1

# The part files written here. model.py also carries its own SPDX line.
[[annotations]]
path = [
  "part.jsonc",
  "model.py",
  "esp32s3-qfn56.glb",
  "esp32s3-qfn56.anchors.json",
  "asset.json",
  "REUSE.toml",
]
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The mask ROM ELF is not UTF-8 and has no SPDX line. LICENSE-rom is Espressif's
# Apache-2.0 text, unchanged. NOTICE quotes the third-party notices the ROM requires.
[[annotations]]
path = ["esp32s3_rev0_rom.elf", "LICENSE-rom", "NOTICE"]
SPDX-License-Identifier = "Apache-2.0"

# hello_world.bin and partition-table.bin are an ESP-IDF app and its partition table.
# NOTICE-hello quotes their notices. The LICENSE files are those texts, unchanged.
[[annotations]]
path = ["LICENSE-freertos"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["LICENSE-tlsf"]
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["LICENSE-ubsan"]
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = ["LICENSE-xtensa"]
SPDX-License-Identifier = "LicenseRef-Cadence-Xtensa"

[[annotations]]
path = ["LICENSE-newlib"]
SPDX-License-Identifier = "LicenseRef-newlib"

[[annotations]]
path = ["hello_world.bin", "partition-table.bin", "NOTICE-hello"]
SPDX-License-Identifier = "Apache-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND LicenseRef-Cadence-Xtensa AND LicenseRef-newlib AND LicenseRef-GCC-Runtime-Library-Exception"

[workspace]
resolver = "3"
members = ["crates/core", "crates/circuit", "crates/cli", "crates/avr", "crates/xtensa", "crates/esp32", "crates/bench", "crates/wasm"]

[workspace.package]
version = "0.31.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sim-core = { path = "crates/core" }
sim-avr = { path = "crates/avr" }
sim-esp32 = { path = "crates/esp32" }
sim-xtensa = { path = "crates/xtensa" }
sim-circuit = { path = "crates/circuit" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
# Exact, because a new libm can move the last bits of a run.
libm = "=0.2.16"
clap = { version = "4", features = ["derive"] }
# Exact, because the `wasm-bindgen` CLI that `scripts/wasm.sh` runs must be the same version.
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"

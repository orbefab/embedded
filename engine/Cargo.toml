[workspace]
resolver = "3"
members = ["crates/core", "crates/circuit", "crates/cli", "crates/avr", "crates/bench"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/core" }
sim-avr = { path = "crates/avr" }
sim-circuit = { path = "crates/circuit" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

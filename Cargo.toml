[workspace]
resolver = "3"
members = [
  "apps/orbe",
  "packages/scene",
  "packages/registry",
  "packages/session",
  "packages/wasm",
  "packages/engine",
  "packages/cores/*",
  "packages/socs/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
orbe-scene = { path = "packages/scene" }
orbe-registry = { path = "packages/registry" }
orbe-session = { path = "packages/session" }
orbe-engine = { path = "packages/engine" }
orbe-xtensa = { path = "packages/cores/xtensa" }
orbe-avr = { path = "packages/cores/avr" }
orbe-microchip = { path = "packages/socs/microchip" }
orbe-espressif = { path = "packages/socs/espressif" }
jsonc-parser = "=0.34.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
schemars = "1"
# Tests only, and without its HTTP and file resolvers, so it never fetches a schema.
jsonschema = { version = "0.61", default-features = false }
httparse = "1"
sha2 = "0.10"
# Exact, because a new libm can move the last bits of a run.
libm = "=0.2.16"
strsim = "0.11"
# Reads a part's or a Block's REUSE.toml, which gives files with no SPDX line their licence.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
rustix = { version = "1", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ctrlc = "3.4"
# Handshake only. The viewer serves plain HTTP on localhost and speaks no TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Exact, because the `wasm-bindgen` CLI that `scripts/wasm.sh` runs must be the same version.
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"

# The chip models run firmware instruction by instruction, so builds without optimisation still
# optimise the solver, the cores and the chips.
[profile.dev.package.orbe-engine]
opt-level = 3

[profile.dev.package.orbe-microchip]
opt-level = 3

[profile.dev.package.orbe-avr]
opt-level = 3

[profile.dev.package.orbe-xtensa]
opt-level = 3

[profile.dev.package.orbe-espressif]
opt-level = 3

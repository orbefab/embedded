[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
orbe-scene = { path = "crates/orbe-scene" }
orbe-session = { path = "crates/orbe-session" }
sim-core = { path = "engine/crates/core" }
sim-circuit = { path = "engine/crates/circuit" }
jsonc-parser = "=0.34.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
strsim = "0.11"
rustix = { version = "1", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
ctrlc = "3.4"
tungstenite = { version = "0.30", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# The engine runs the ATmega328P's firmware instruction by instruction, so the reader's tests
# that run it optimise the engine.
[profile.dev.package.sim-avr]
opt-level = 3

[profile.dev.package.sim-circuit]
opt-level = 3

[package]
name = "orbe-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true, optional = true }
libm.workspace = true
orbe-espressif.workspace = true
orbe-mcu.workspace = true
orbe-microchip.workspace = true
orbe-model = { workspace = true, features = ["serde"] }
orbe-xtensa.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
object.workspace = true

[features]
# Tests only: `simulate_steps`, a row at every accepted step.
step-rows = []
# The `orbe-run` binary and the run report it prints. `orbe` and `orbe-wasm` leave this off, so
# they build neither.
runner = ["dep:clap"]

[[bin]]
name = "orbe-run"
path = "src/bin/orbe-run.rs"
required-features = ["runner"]

[dev-dependencies]
orbe-engine = { path = ".", features = ["step-rows", "runner"] }

[lints]
workspace = true

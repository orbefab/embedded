[package]
name = "orbe-scene"
description = "Reads an orbe scene and its part files into the engine's netlist v0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# JSON Schemas of the card types, for the registry. The browser build never needs them.
schema = ["dep:schemars"]

[dependencies]
jsonc-parser.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
orbe-engine-core.workspace = true
orbe-circuit.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true

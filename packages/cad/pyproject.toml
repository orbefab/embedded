[project]
name = "orbe-cad"
version = "0.0.0"
description = "Helpers for part models."
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = [
    "build123d==0.11.1",
    "cadquery-ocp-novtk==7.9.3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad"]

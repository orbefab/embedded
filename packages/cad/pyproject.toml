[project]
name = "orbe-cad"
version = "0.0.0"
description = "Helpers for part models."
requires-python = ">=3.12,<3.15"
license = "MIT OR Apache-2.0"
dependencies = [
    "build123d==0.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad"]

[dependency-groups]
dev = [
    "ruff==0.17.4",
]
